name: Discover Endpoints & Update Gatus Config

on:
  # Manual trigger
  workflow_dispatch:

  # Scheduled trigger (runs weekly on Mondays at 2 AM UTC)
  schedule:
    - cron: '0 2 * * 1'

  # Can also trigger on push to main if you want
  push:
    branches: [main]
    paths:
      - 'scripts/generate-gatus-config.sh'
      - 'scripts/generate-gatus-config.py'

jobs:
  discover-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: sudo apt install jq kubectl

      - name: Run endpoint discovery
        env:
          KUBE64: ${{ secrets.KUBE64 }}
        run: |
          chmod +x scripts/generate-gatus-config.py
          OUTPUT_FILE=scripts/config.yaml python3 scripts/generate-gatus-config.py

      - name: Validate Gatus configuration
        run: |
          echo "Validating YAML syntax..."
          yq eval '.' scripts/config.yaml > /dev/null

          echo "Checking for duplicate endpoint names..."
          DUPLICATES=$(yq eval '.endpoints[].name' scripts/config.yaml | sort | uniq -d)
          if [ -n "$DUPLICATES" ]; then
            echo "Error: Duplicate endpoint names found:"
            echo "$DUPLICATES"
            exit 1
          fi

          echo "Testing configuration with Gatus container..."
          docker run -d --name gatus-validator \
            -e DISCORD_WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK_URL || 'https://discord.com/api/webhooks/dummy' }}" \
            -v "$PWD/scripts/config.yaml:/config/config.yaml:ro" \
            twinproduction/gatus:latest

          sleep 3

          if ! docker ps -q --filter "name=gatus-validator" --filter "status=running" | grep -q .; then
            echo "Error: Gatus failed to start with generated configuration."
            docker logs gatus-validator
            docker rm -f gatus-validator > /dev/null 2>&1 || true
            exit 1
          fi

          docker rm -f gatus-validator > /dev/null 2>&1
          echo "Gatus configuration validation successful."

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet scripts/config.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in scripts/config.yaml"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in scripts/config.yaml"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add scripts/config.yaml
          git commit -m "Auto-update Gatus config - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No commit needed"
          git pull --rebase origin main
          git push origin main

      - name: Trigger deployment
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: config-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'

      - name: Summary
        run: |
          echo "## Endpoint Discovery Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "Config updated and deployment triggered" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Changes:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            git diff HEAD~1 scripts/config.yaml | head -50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No changes detected in endpoint configuration" >> $GITHUB_STEP_SUMMARY
          fi
